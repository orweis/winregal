[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "winregal"
dynamic = ["version"]
description = "A Modern Python wrapper for the Windows registry"
readme = "README.rst"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Or Weis", email = "py@bitweis.com" }]
keywords = ["winregal", "registry", "windows", "windows registry", "winreg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/orweis/winregal"
Changelog = "https://github.com/orweis/winregal/blob/master/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov"]

[tool.setuptools]
packages = ["winregal"]

[tool.setuptools.dynamic]
version = { attr = "winregal.__version__" }

[tool.setuptools.package-data]
winregal = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["windows: integration tests that use the real Windows registry"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
